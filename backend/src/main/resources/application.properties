spring.application.name=bookstore-management
spring.datasource.url=jdbc:h2:mem:bookstore;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
logging.level.com.example.bookstore=INFO
